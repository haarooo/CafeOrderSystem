name: CafeOrderSystem Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. gradlew 실행 권한 부여
      - name: Add permission for gradlew
        run: chmod +x ./gradlew

      # 4. Spring Boot + React 통합 JAR 빌드
      # build.gradle 안에서 React npm install, npm run build, static 포함까지 처리됨
      - name: Build Spring Boot with React
        run: ./gradlew clean bootJar
        shell: bash

      # 5. 실제 배포할 JAR 파일 찾기
      - name: Set artifact name
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          echo "ARTIFACT=$(basename $JAR_FILE)" >> $GITHUB_ENV
          echo "Deploy artifact: $JAR_FILE"

      # 6. 배포 버전명 생성
      - name: Versioning
        uses: 1466587594/get-current-time@v2
        id: time
        with:
          format: YYYY-MM-DD-HH-mm-ss
          utcOffset: "+09:00"

      # 7. AWS Elastic Beanstalk 배포
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ap-northeast-2

          application_name: CafeOrderSystem
          environment_name: CafeOrderSystem-env

          version_label: "cafe-order-${{ steps.time.outputs.formattedTime }}"
          deployment_package: "./build/libs/${{ env.ARTIFACT }}"
          wait_for_environment_recovery: 30